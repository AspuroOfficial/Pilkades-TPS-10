<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F2F5FC">
<title>Checkin TPS 10 · Kobak Sumur — Pilkades Sukamakmur</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checkin TPS 10">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#262B45;
    --ink-soft:#5F6480;
    --ink-faint:#9296B0;
    --paper:#F3F6FC;
    --card:rgba(255,255,255,0.6);
    --card-strong:rgba(255,255,255,0.88);
    --line:rgba(38,43,69,0.09);

    /* ---- Liquid-glass pastel palette ---- */
    --blue:#4F8FE8; --blue-2:#A9CBFB;
    --green:#3FA66B; --green-2:#9BE3BE;
    --orange:#E29341; --orange-2:#F7C989;
    --yellow:#EFBD3E; --yellow-2:#FBE39B;
    --pink:#D06C93; --pink-2:#F2B8D0;
    --red:#DD6B58; --red-2:#F5AB9C;

    --teal:var(--green);
    --teal-2:var(--green-2);
    --rose:var(--pink);
    --rose-2:var(--pink-2);
    --danger:#D3573F;

    --accent:var(--blue);
    --accent-2:var(--blue-2);
    --accent-dark:#3568B8;
    --accent-tint:rgba(79,143,232,0.14);
    --accent-tint-strong:rgba(79,143,232,0.26);
    --accent-shadow:rgba(79,143,232,0.38);

    --shadow-sm: 0 8px 24px -12px rgba(38,43,69,0.22);
    --shadow-lg: 0 28px 70px -24px rgba(38,43,69,0.32);
    --radius-lg: 26px;
    --radius-md: 18px;
    --radius-sm: 13px;
    --font-display:'Baloo 2', 'Nunito', sans-serif;
    --font-body:'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--paper);
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-2); color:var(--ink);}

  /* ---------- Ambient background ---------- */
  .bg-scene{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .bg-scene::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, #EAF1FD 0%, #F0F4FC 26%, var(--paper) 60%);
  }
  .blob{position:absolute; border-radius:50%; filter:blur(64px); opacity:.45; animation:float 22s ease-in-out infinite; transition:background .5s ease;}
  .blob-1{width:340px; height:340px; background:var(--blue); top:-90px; left:-80px; animation-duration:24s;}
  .blob-2{width:300px; height:300px; background:var(--yellow); top:60px; right:-100px; animation-duration:28s; animation-delay:-6s;}
  .blob-3{width:280px; height:280px; background:var(--pink); bottom:8%; left:-60px; animation-duration:26s; animation-delay:-12s; opacity:.32;}
  .blob-4{width:260px; height:260px; background:var(--green); top:38%; right:6%; animation-duration:30s; animation-delay:-9s; opacity:.28;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(24px,-26px) scale(1.08);}
  }

  .app{position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    padding:calc(env(safe-area-inset-top) + 16px) 18px 14px;
    background:
      radial-gradient(140% 120% at 100% -30%, var(--accent-tint-strong), transparent 55%),
      linear-gradient(120deg, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.48) 70%, rgba(255,255,255,0.3) 100%);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,0.55);
    color:var(--ink);
    transition:background .5s ease;
  }
  .header-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .header-brand{display:flex; align-items:center; gap:11px; min-width:0;}
  .tps-logo{width:40px; height:auto; max-height:46px; flex-shrink:0; border-radius:6px; filter:drop-shadow(0 4px 10px rgba(38,43,69,0.18));}
  .header-title{font-family:var(--font-display); font-weight:700; font-size:25px; line-height:1.05; letter-spacing:.2px; color:var(--ink);}
  .header-sub{margin-top:3px; font-size:12.5px; color:var(--ink-soft); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .header-actions{display:flex; gap:8px; flex-shrink:0;}
  .guest-chip{display:none; align-items:center; margin-left:9px; padding:3px 9px 2px; border-radius:99px; background:var(--accent-tint-strong); border:1px solid rgba(255,255,255,0.6); font-size:9.5px; font-weight:800; letter-spacing:.5px; color:var(--accent-dark); text-transform:uppercase; vertical-align:middle;}
  .icon-btn{
    width:38px; height:38px; border-radius:12px; border:1px solid rgba(255,255,255,0.7);
    background:rgba(255,255,255,0.5); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s ease, transform .1s ease, box-shadow .2s ease;
  }
  .icon-btn:active{transform:scale(0.92); box-shadow:0 0 0 6px var(--accent-tint);}
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn.spinning svg{animation:spin 1s linear infinite;}
  .icon-btn.accent{background:linear-gradient(135deg, var(--accent), var(--accent-2)); border-color:transparent; color:#fff; box-shadow:0 8px 18px -8px var(--accent-shadow);}
  @keyframes spin{to{transform:rotate(360deg);}}

  .header-meta{display:flex; align-items:center; gap:13px; margin-top:14px; font-size:12px; color:var(--ink-soft); font-weight:600; flex-wrap:wrap; row-gap:6px;}
  .meta-item{display:flex; align-items:center; gap:5px;}
  .meta-item svg{width:13px; height:13px; opacity:.85;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex-shrink:0;}
  .sync-dot.online{background:#6FCF97; box-shadow:0 0 0 3px rgba(111,207,151,0.22);}
  .sync-dot.syncing{background:var(--accent-2); animation:pulse 1.1s ease-in-out infinite;}
  .sync-dot.offline{background:var(--rose-2);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.4;}}

  main{flex:1; padding:6px 18px 130px;}

  /* ---------- Mode switch (quick nav: Absensi / Hitung Suara) ---------- */
  .mode-switch{display:flex; gap:6px; padding:5px; margin:12px 0 4px;}
  .mode-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:7px;
    border:none; background:transparent; padding:12px 10px; border-radius:99px;
    font-family:var(--font-body); font-weight:800; font-size:13px; color:var(--ink-soft);
    cursor:pointer; transition:background .25s ease, color .2s ease, box-shadow .25s ease, transform .08s ease;
  }
  .mode-btn:active{transform:scale(0.97);}
  .mode-btn svg{width:16px; height:16px; flex-shrink:0;}
  .mode-btn.active{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; box-shadow:0 10px 22px -10px var(--accent-shadow);}
  .mode-btn[data-mode="suara"].active{background:linear-gradient(135deg, var(--green), var(--green-2)); box-shadow:0 10px 22px -10px rgba(63,166,107,0.42);}
  body.mode-suara .mode-absensi-only{display:none !important;}
  body:not(.mode-suara) .mode-suara-only{display:none !important;}

  /* ---------- Glass card base (liquid glass + soft neon edge) ---------- */
  .glass{
    background:var(--card);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.65);
    box-shadow:
      var(--shadow-sm),
      inset 0 1px 0 rgba(255,255,255,0.6),
      0 0 0 1px rgba(255,255,255,0.3),
      0 0 22px -9px rgba(79,143,232,0.24),
      0 0 26px -11px rgba(208,108,147,0.16);
    border-radius:var(--radius-lg);
    transition:box-shadow .4s ease;
  }

  /* ---------- Hero ---------- */
  .hero{margin-top:14px; padding:22px 20px 20px; text-align:center;}
  .ring-wrap{position:relative; width:172px; height:172px; margin:4px auto 2px;}
  .ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:rgba(32,34,61,0.08); stroke-width:11;}
  .ring-progress{fill:none; stroke:url(#ringGradient); stroke-width:11; stroke-linecap:round; transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-percent{font-family:var(--font-display); font-weight:600; font-size:38px; line-height:1; letter-spacing:-.5px;}
  .ring-label{font-size:11.5px; color:var(--ink-soft); margin-top:5px; font-weight:600;}

  .hero-caption{margin-top:10px; font-size:13.5px; color:var(--ink-soft);}
  .hero-caption b{color:var(--ink); font-weight:700;}

  .compare-bar{margin:16px 2px 4px; height:10px; border-radius:99px; background:rgba(32,34,61,0.08); overflow:hidden; position:relative;}
  .compare-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); width:0%; transition:width 1.1s cubic-bezier(.16,1,.3,1), background .5s ease;}
  .compare-labels{display:flex; justify-content:space-between; margin-top:7px; font-size:12px; color:var(--ink-soft); font-weight:600;}
  .compare-labels span b{color:var(--ink);}

  /* ---------- Stat pills ---------- */
  .pill-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
  .pill{padding:14px 14px 12px; text-align:left;}
  .pill-top{display:flex; align-items:center; gap:8px;}
  .pill-icon{width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .pill-icon svg{width:16px; height:16px;}
  .pill.male .pill-icon{background:rgba(44,140,130,0.14); color:var(--teal);}
  .pill.female .pill-icon{background:rgba(193,92,119,0.14); color:var(--rose);}
  .pill-name{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .pill-num{font-family:var(--font-display); font-size:22px; font-weight:600; margin-top:8px;}
  .pill-num small{font-family:var(--font-body); font-size:12.5px; font-weight:600; color:var(--ink-faint);}
  .pill-bar{margin-top:8px; height:5px; border-radius:99px; background:rgba(32,34,61,0.08); overflow:hidden;}
  .pill-bar-fill{height:100%; border-radius:99px; width:0%; transition:width 1s cubic-bezier(.16,1,.3,1);}
  .pill.male .pill-bar-fill{background:linear-gradient(90deg, var(--teal), var(--teal-2));}
  .pill.female .pill-bar-fill{background:linear-gradient(90deg, var(--rose), var(--rose-2));}

  /* ---------- Kampung breakdown ---------- */
  .section{margin-top:22px;}
  .section-title{font-size:14.5px; font-weight:700; color:var(--ink); margin:0 2px 10px; display:flex; align-items:center; justify-content:space-between;}
  .section-title span.count{font-weight:600; font-size:12px; color:var(--ink-faint);}

  .kampung-card{padding:6px 16px;}
  .kampung-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);}
  .kampung-row:last-child{border-bottom:none;}
  .kampung-icon{width:28px; height:28px; border-radius:9px; background:var(--accent-tint); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .5s ease, color .5s ease;}
  .kampung-icon svg{width:14px; height:14px;}
  .kampung-body{flex:1; min-width:0;}
  .kampung-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:5px;}
  .kampung-name{font-size:13.5px; font-weight:700;}
  .kampung-frac{font-size:12px; color:var(--ink-soft); font-weight:600; flex-shrink:0;}
  .kampung-bar{height:5px; border-radius:99px; background:rgba(32,34,61,0.08); overflow:hidden;}
  .kampung-bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); width:0%; transition:width 1s cubic-bezier(.16,1,.3,1), background .5s ease;}

  /* ---------- Rekap suara (didesain ulang, lebih modern) ---------- */
  .suara-card{padding:18px 16px 20px;}
  .suara-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line);}
  .suara-row:last-child{border-bottom:none;}
  .suara-cand{display:flex; align-items:center; gap:10px; min-width:0; flex:1;}
  .suara-cand-badge{
    width:27px; height:27px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:13px; color:#fff; box-shadow:0 6px 12px -6px rgba(38,43,69,0.35);
  }
  .suara-cand-badge.c0{background:linear-gradient(135deg, var(--blue), var(--blue-2));}
  .suara-cand-badge.c1{background:linear-gradient(135deg, var(--green), var(--green-2));}
  .suara-cand-badge.c2{background:linear-gradient(135deg, var(--orange), var(--orange-2));}
  .suara-cand-badge.c3{background:linear-gradient(135deg, var(--pink), var(--pink-2));}
  .suara-cand-badge.c4{background:linear-gradient(135deg, var(--red), var(--red-2));}
  .suara-cand-badge.c5{background:linear-gradient(135deg, var(--yellow), var(--yellow-2));}
  .suara-cand-avatar{width:36px; height:36px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .suara-cand-avatar svg{width:18px; height:18px;}
  .suara-cand-avatar.c0{background:rgba(79,143,232,0.14); color:var(--blue);}
  .suara-cand-avatar.c1{background:rgba(63,166,107,0.14); color:var(--green);}
  .suara-cand-avatar.c2{background:rgba(226,147,65,0.16); color:var(--orange);}
  .suara-cand-avatar.c3{background:rgba(208,108,147,0.14); color:var(--pink);}
  .suara-cand-avatar.c4{background:rgba(221,107,88,0.14); color:var(--red);}
  .suara-cand-avatar.c5{background:rgba(239,189,62,0.18); color:#96650F;}
  .suara-candidate-name{font-size:13.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .suara-invalid-icon{width:36px; height:36px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(211,87,63,0.12); color:var(--danger);}
  .suara-invalid-icon svg{width:16px; height:16px;}

  .suara-stepper{display:flex; align-items:center; gap:5px; flex-shrink:0;}
  .stepper-btn{
    width:30px; height:30px; border-radius:10px; border:none; flex-shrink:0; padding:0;
    display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:800; line-height:1;
    font-family:var(--font-body); cursor:pointer; background:rgba(32,34,61,0.07); color:var(--ink-soft);
    transition:background .15s ease, transform .1s ease, opacity .15s ease;
  }
  .stepper-btn:active{transform:scale(0.88);}
  .stepper-btn.plus{background:rgba(63,166,107,0.15); color:var(--green);}
  .stepper-btn.minus{background:rgba(221,107,88,0.15); color:var(--red);}
  .stepper-btn:disabled{opacity:.4; pointer-events:none;}
  .suara-input{
    width:50px; height:30px; border-radius:10px; border:1.5px solid var(--line); background:rgba(255,255,255,0.85);
    text-align:center; font-size:14px; font-weight:800; font-family:var(--font-display); color:var(--ink); padding:0;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .suara-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-tint);}
  .suara-input:disabled{opacity:.55;}
  .suara-invalid-row{margin-top:4px;}
  .suara-divider{height:1px; background:var(--line); margin:12px 0;}
  .suara-total-row{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--ink-soft); padding:3px 0; font-weight:600;}
  .suara-total-row b{color:var(--ink); font-weight:700; font-family:var(--font-display); font-size:17px;}
  .suara-sync{margin-top:13px; padding:11px 13px; border-radius:12px; font-size:12.5px; font-weight:700; text-align:center; transition:background .2s ease, color .2s ease;}
  .suara-sync.ok{background:rgba(44,140,130,0.14); color:var(--teal);}
  .suara-sync.warn{background:rgba(193,82,63,0.1); color:var(--danger);}
  .suara-sync.info{background:rgba(95,100,128,0.1); color:var(--ink-soft);}
  .suara-meta{margin-top:10px; font-size:11.5px; color:var(--ink-faint); text-align:center;}
  .suara-guest-note{margin-top:12px; font-size:12px; color:var(--ink-faint); text-align:center;}
  .suara-actions{display:flex; flex-direction:column; gap:8px; margin-top:14px;}

  /* ---------- Search & filters ---------- */
  .search-shell{position:relative; margin-top:4px;}
  .search-wrap{position:relative; transition:transform .15s ease;}
  .search-wrap svg.search-ic{position:absolute; left:17px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--ink-faint); pointer-events:none; transition:color .2s ease;}
  .search-wrap:focus-within svg.search-ic{color:var(--accent);}
  .search-wrap:focus-within{transform:translateY(-1px);}
  #searchInput{
    width:100%; height:50px; border-radius:99px; border:1.5px solid rgba(255,255,255,0.6);
    background:var(--card-strong); backdrop-filter:blur(14px);
    padding:0 44px; font-size:14.5px; font-family:var(--font-body); color:var(--ink);
    box-shadow:var(--shadow-sm);
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  #searchInput::placeholder{color:var(--ink-faint);}
  #searchInput:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 5px var(--accent-tint), var(--shadow-sm);}
  .clear-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:32px; height:32px; border-radius:50%; border:none; background:rgba(32,34,61,0.07); color:var(--ink-soft); display:none; align-items:center; justify-content:center; cursor:pointer;}

  /* ---------- Autocomplete suggestions ---------- */
  .suggest-panel{
    position:absolute; left:2px; right:2px; top:calc(100% + 8px); z-index:25;
    background:var(--card-strong); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.65); border-radius:var(--radius-md);
    box-shadow:var(--shadow-lg); overflow:hidden; max-height:0; opacity:0; pointer-events:none;
    transition:max-height .22s cubic-bezier(.16,1,.3,1), opacity .16s ease;
  }
  .suggest-panel.show{max-height:360px; opacity:1; pointer-events:auto; overflow-y:auto;}
  .suggest-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s ease;}
  .suggest-row:last-child{border-bottom:none;}
  .suggest-row:hover, .suggest-row.key-active{background:rgba(32,34,61,0.05);}
  .suggest-info{flex:1; min-width:0;}
  .suggest-name{font-size:13.5px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .suggest-name mark{background:var(--accent-tint-strong); color:var(--ink); border-radius:4px; padding:0 1px;}
  .suggest-meta{font-size:11.5px; color:var(--ink-soft); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .suggest-check{flex-shrink:0; width:34px; height:34px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; box-shadow:0 8px 16px -8px var(--accent-shadow); transition:transform .1s ease, opacity .15s ease;}
  .suggest-check:active{transform:scale(0.88);}
  .suggest-check[disabled]{opacity:.55; pointer-events:none;}
  .suggest-check svg{width:16px; height:16px;}
  .suggest-tag-hadir{flex-shrink:0; font-size:10px; font-weight:700; padding:5px 9px; border-radius:99px; background:rgba(44,140,130,0.15); color:var(--teal); white-space:nowrap;}
  .suggest-tag-belum{flex-shrink:0; font-size:10px; font-weight:700; padding:5px 9px; border-radius:99px; background:rgba(32,34,61,0.07); color:var(--ink-faint); white-space:nowrap;}
  .suggest-empty{padding:18px 16px; text-align:center; font-size:12.5px; color:var(--ink-faint);}
  .clear-btn svg{width:13px; height:13px;}
  .clear-btn.show{display:flex;}

  .chip-row{
    display:flex; flex-wrap:wrap; align-items:stretch; gap:8px; margin:10px 0 4px; padding:2px 0 6px;
  }
  .chip{
    flex:1 1 auto; min-width:88px; text-align:center; padding:9px 12px; border-radius:99px; font-size:clamp(11px,3vw,12.5px); font-weight:700;
    background:var(--card-strong); border:1px solid rgba(255,255,255,0.75); color:var(--ink-soft);
    cursor:pointer; transition:background .15s ease, color .15s ease, border-color .15s ease, box-shadow .2s ease, transform .08s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chip:active{transform:scale(0.96);}
  .chip.active{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; border-color:transparent; box-shadow:0 8px 18px -10px var(--accent-shadow);}

  .segmented{display:flex; margin-top:10px; background:rgba(38,43,69,0.06); border-radius:99px; padding:3px; gap:2px;}
  .segmented button{flex:1; min-width:0; border:none; background:transparent; padding:9px 4px; border-radius:99px; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:background .2s ease, color .2s ease, box-shadow .2s ease;}
  .segmented button.active{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; box-shadow:0 8px 18px -10px var(--accent-shadow);}

  /* ---------- Voter list ---------- */
  .voter-list{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .voter-card{
    display:flex; align-items:center; gap:11px; padding:12px 14px;
    border-radius:var(--radius-md); cursor:pointer;
    transition:transform .08s ease;
  }
  .voter-card:active{transform:scale(0.985);}
  .voter-gender-dot{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .voter-gender-dot svg{width:18px; height:18px;}
  .voter-gender-dot.male{background:rgba(44,140,130,0.14); color:var(--teal);}
  .voter-gender-dot.female{background:rgba(193,92,119,0.14); color:var(--rose);}
  .voter-info{flex:1; min-width:0;}
  .voter-name{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .voter-meta{font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .voter-status{flex-shrink:0; font-size:11px; font-weight:700; padding:6px 10px; border-radius:99px; display:flex; align-items:center; gap:4px;}
  .voter-status svg{width:11px; height:11px;}
  .voter-status.belum{background:rgba(32,34,61,0.07); color:var(--ink-faint);}
  .voter-status.hadir{background:rgba(44,140,130,0.15); color:var(--teal);}

  .empty-state{text-align:center; padding:48px 24px; color:var(--ink-soft);}
  .empty-state svg{width:38px; height:38px; color:var(--ink-faint); margin-bottom:10px;}
  .empty-state p{margin:0; font-size:13.5px; line-height:1.5;}

  .skeleton{height:64px; border-radius:var(--radius-md); background:linear-gradient(100deg, rgba(255,255,255,0.35) 30%, rgba(255,255,255,0.65) 50%, rgba(255,255,255,0.35) 70%); background-size:200% 100%; animation:shimmer 1.5s ease-in-out infinite;}
  @keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}

  /* ---------- Overlay (full) ---------- */
  .overlay{position:fixed; inset:0; z-index:100; display:flex; align-items:flex-end; justify-content:center; visibility:hidden;}
  .overlay.show{visibility:visible;}
  .overlay-backdrop{position:absolute; inset:0; background:rgba(20,21,38,0.55); backdrop-filter:blur(3px); opacity:0; transition:opacity .25s ease;}
  .overlay.show .overlay-backdrop{opacity:1;}
  .overlay-panel{
    position:relative; width:100%; max-width:480px; max-height:92dvh; overflow-y:auto;
    background:#FBF9F4; border-radius:28px 28px 0 0;
    padding:14px 22px calc(env(safe-area-inset-bottom) + 26px);
    transform:translateY(100%); transition:transform .34s cubic-bezier(.16,1,.3,1);
    box-shadow:0 -20px 60px -20px rgba(20,21,38,0.5);
  }
  .overlay.show .overlay-panel{transform:translateY(0);}
  .overlay-grip{width:38px; height:4px; border-radius:99px; background:rgba(32,34,61,0.15); margin:2px auto 14px;}
  .overlay-close{position:absolute; top:16px; right:18px; width:34px; height:34px; border-radius:50%; border:none; background:rgba(32,34,61,0.06); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .overlay-close svg{width:14px; height:14px;}

  .ov-avatar{width:64px; height:64px; border-radius:20px; display:flex; align-items:center; justify-content:center; margin:8px auto 14px;}
  .ov-avatar svg{width:30px; height:30px;}
  .ov-avatar.male{background:rgba(44,140,130,0.14); color:var(--teal);}
  .ov-avatar.female{background:rgba(193,92,119,0.14); color:var(--rose);}
  .ov-name{font-family:var(--font-display); font-size:23px; font-weight:600; text-align:center; line-height:1.2;}
  .ov-sub{text-align:center; font-size:13px; color:var(--ink-soft); margin-top:5px;}

  .ov-detail{margin-top:20px; border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:11px;}
  .ov-row{display:flex; justify-content:space-between; gap:12px; font-size:13.5px;}
  .ov-row .k{color:var(--ink-soft);}
  .ov-row .v{font-weight:700; text-align:right;}
  .ov-tag{display:inline-block; margin-top:2px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; background:rgba(222,154,62,0.16); color:#96650F;}

  .ov-actions{margin-top:22px;}
  .btn{
    width:100%; border:none; border-radius:16px; padding:15px 18px; font-family:var(--font-body);
    font-size:14.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn[disabled]{opacity:.6; pointer-events:none;}
  .btn svg{width:17px; height:17px;}
  .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-dark)); color:#fff; box-shadow:0 14px 30px -12px var(--accent-shadow); transition:background .5s ease, box-shadow .5s ease, transform .08s ease;}
  .btn-primary:active{transform:scale(0.97);}
  .btn-ghost{background:rgba(32,34,61,0.06); color:var(--ink-soft); margin-top:10px;}
  .btn-danger-text{background:transparent; color:var(--danger); margin-top:10px; font-size:13px;}
  .btn-danger{background:linear-gradient(135deg, var(--red), var(--danger)); color:#fff; box-shadow:0 14px 30px -14px rgba(211,87,63,0.55);}

  .ov-error{margin-top:12px; padding:11px 13px; border-radius:12px; background:rgba(193,82,63,0.1); color:var(--danger); font-size:12.5px; font-weight:600; display:none; align-items:center; gap:8px;}
  .ov-error.show{display:flex;}
  .ov-error svg{width:15px; height:15px; flex-shrink:0;}
  .ov-guest-note{display:none; margin-top:14px; padding:11px 13px; border-radius:12px; background:rgba(32,34,61,0.06); color:var(--ink-soft); font-size:12px; font-weight:600; text-align:center;}

  /* success state */
  .ov-success{display:none; flex-direction:column; align-items:center; padding:20px 0 6px;}
  .ov-success.show{display:flex;}
  .ov-success svg{width:76px; height:76px;}
  .check-circle{stroke:var(--teal); stroke-width:3; stroke-dasharray:145; stroke-dashoffset:145; animation:drawCircle .5s ease forwards;}
  .check-mark{stroke:var(--teal); stroke-width:4; stroke-dasharray:48; stroke-dashoffset:48; animation:drawMark .4s .35s ease forwards;}
  @keyframes drawCircle{to{stroke-dashoffset:0;}}
  @keyframes drawMark{to{stroke-dashoffset:0;}}
  .ov-success-title{font-family:var(--font-display); font-size:20px; font-weight:600; margin-top:14px;}
  .ov-success-sub{font-size:13px; color:var(--ink-soft); margin-top:4px; text-align:center;}

  /* ---------- Small utility overlay (petugas / setup) ---------- */
  .center-overlay{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; visibility:hidden;}
  .center-overlay.show{visibility:visible;}
  .center-overlay .overlay-backdrop{opacity:0;}
  .center-overlay.show .overlay-backdrop{opacity:1;}
  .center-panel{
    position:relative; width:100%; max-width:360px; background:#FBF9F4; border-radius:24px; padding:24px 22px;
    box-shadow:var(--shadow-lg); transform:scale(0.92); opacity:0; transition:transform .25s cubic-bezier(.16,1,.3,1), opacity .2s ease;
  }
  .center-overlay.show .center-panel{transform:scale(1); opacity:1;}
  .center-icon{width:46px; height:46px; border-radius:14px; background:rgba(44,140,130,0.14); color:var(--teal); display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
  .center-icon.warn{background:rgba(211,87,63,0.14); color:var(--danger);}
  .center-icon svg{width:22px; height:22px;}
  .center-panel h3{font-family:var(--font-display); font-size:19px; font-weight:600; margin:0 0 8px;}
  .center-panel p{font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0 0 16px;}
  .center-panel code{background:rgba(32,34,61,0.07); padding:2px 5px; border-radius:5px; font-size:11.5px;}
  #petugasInput{
    width:100%; height:46px; border-radius:13px; border:1px solid var(--line); padding:0 14px;
    font-size:14px; font-family:var(--font-body); margin-bottom:12px;
  }
  #petugasInput:focus{outline:none; border-color:var(--accent);}

  .settings-divider{height:1px; background:var(--line); margin:18px 0 14px;}
  #logoutBtn{margin-top:2px;}

  /* ---------- Login screen ---------- */
  #loginScreen{
    position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:hidden;
    background:linear-gradient(160deg,#EAF1FD 0%, #F5EFFA 40%, var(--paper) 100%);
    transition:opacity .5s ease, visibility .5s ease;
  }
  #loginScreen.hide{opacity:0; visibility:hidden; pointer-events:none;}
  .login-blobs{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
  .login-blobs .blob-3{opacity:.3;}
  .login-card{
    position:relative; z-index:2; width:100%; max-width:380px; text-align:center;
    background:var(--card-strong); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.6); border-radius:28px; box-shadow:var(--shadow-lg);
    padding:34px 26px 26px;
    animation:loginRise .6s cubic-bezier(.16,1,.3,1);
  }
  @keyframes loginRise{from{opacity:0; transform:translateY(18px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
  .login-logo{width:60px; height:auto; margin:0 auto 14px; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.28));}
  .login-kop-title{font-size:11.5px; font-weight:700; color:var(--ink-soft); line-height:1.4; letter-spacing:.1px;}
  .login-kop-sub{font-size:11px; color:var(--ink-faint); margin-top:2px; font-weight:600;}
  .login-heading{font-family:var(--font-display); font-size:25px; font-weight:600; margin:16px 0 5px;}
  .login-caption{font-size:12.5px; color:var(--ink-soft); line-height:1.55; margin:0 0 22px;}
  .login-field{position:relative; margin-bottom:12px;}
  .login-field svg.login-field-ic{position:absolute; left:15px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--ink-faint); pointer-events:none;}
  .login-field input{width:100%; height:50px; border-radius:15px; border:1.5px solid var(--line); background:rgba(255,255,255,0.75); padding:0 44px; font-size:14.5px; font-family:var(--font-body); color:var(--ink); transition:border-color .2s ease, box-shadow .2s ease;}
  .login-field input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-tint);}
  .login-field select{width:100%; height:50px; border-radius:15px; border:1.5px solid var(--line); background:rgba(255,255,255,0.75); padding:0 40px 0 44px; font-size:14.5px; font-family:var(--font-body); color:var(--ink); appearance:none; -webkit-appearance:none; -moz-appearance:none; cursor:pointer; transition:border-color .2s ease, box-shadow .2s ease;}
  .login-field select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-tint);}
  .login-field select:invalid{color:var(--ink-faint);}
  .login-field svg.login-select-ic{position:absolute; right:15px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--ink-faint); pointer-events:none;}
  .login-eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; border:none; background:transparent; color:var(--ink-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .login-eye svg{width:17px; height:17px;}
  .login-error{display:none; align-items:center; gap:8px; text-align:left; margin:2px 0 14px; padding:11px 13px; border-radius:12px; background:rgba(193,82,63,0.1); color:var(--danger); font-size:12.5px; font-weight:600;}
  .login-error.show{display:flex;}
  .login-error svg{width:15px; height:15px; flex-shrink:0;}
  .login-card.shake{animation:loginShake .4s ease;}
  @keyframes loginShake{20%,60%{transform:translateX(-7px);} 40%,80%{transform:translateX(7px);} 100%{transform:translateX(0);}}
  .login-submit{margin-top:4px;}
  .login-divider{display:flex; align-items:center; gap:10px; margin:16px 0 2px; color:var(--ink-faint); font-size:11.5px; font-weight:600;}
  .login-divider::before, .login-divider::after{content:''; flex:1; height:1px; background:var(--line);}
  .login-guest-btn{margin-top:12px;}
  .login-footnote{margin-top:20px; font-size:10.5px; color:var(--ink-faint);}

  #loginRipple{
    position:fixed; z-index:510; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%;
    background:radial-gradient(circle, var(--accent-2), var(--accent) 70%);
    transform:scale(0); opacity:0; pointer-events:none;
    transition:transform .75s cubic-bezier(.4,0,.2,1), opacity .35s ease;
  }
  #loginRipple.expand{opacity:1; transform:scale(60);}
  #loginRipple.fade{opacity:0;}

  /* ---------- Loading overlay ---------- */
  #loadingOverlay{
    position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(160deg,#EAF1FD,#F5EFFA); color:var(--ink); transition:opacity .45s ease, visibility .45s ease;
    overflow:hidden;
  }
  #loadingOverlay.hide{opacity:0; visibility:hidden; pointer-events:none;}
  #loadingOverlay::before{
    content:''; position:absolute; width:480px; height:480px; border-radius:50%; z-index:0;
    background:conic-gradient(from 0deg, var(--blue), var(--pink), var(--yellow), var(--green), var(--blue));
    filter:blur(90px); opacity:.28; animation:loadBgSpin 8s linear infinite;
  }
  @keyframes loadBgSpin{to{transform:rotate(360deg);}}
  .load-orbit{position:relative; width:104px; height:104px; display:flex; align-items:center; justify-content:center; z-index:1;}
  .load-orbit-ring{position:absolute; inset:0; border-radius:50%; border:3px solid transparent; border-top-color:var(--accent); border-right-color:var(--accent-2); animation:spin 1.15s cubic-bezier(.65,0,.35,1) infinite;}
  .load-orbit-ring-2{inset:13px; border-top-color:var(--pink); border-right-color:transparent; border-bottom-color:var(--yellow); animation-duration:1.7s; animation-direction:reverse; opacity:.8;}
  .load-logo{position:relative; z-index:2; width:50px; height:auto; border-radius:13px; background:#fff; padding:6px;
    box-shadow:0 12px 30px -10px rgba(79,143,232,0.55); animation:loadLogoPulse 2.1s ease-in-out infinite;}
  @keyframes loadLogoPulse{0%,100%{transform:scale(1); box-shadow:0 12px 30px -10px rgba(79,143,232,0.45);} 50%{transform:scale(1.07); box-shadow:0 16px 38px -8px rgba(79,143,232,0.65);}}
  #loadingOverlay p{margin-top:18px; font-size:13.5px; color:var(--ink-soft); font-weight:700; z-index:1; letter-spacing:.1px;}
  .load-dots{display:flex; gap:7px; margin-top:12px; z-index:1;}
  .load-dots span{width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.35; animation:loadDotBounce 1.1s ease-in-out infinite;}
  .load-dots span:nth-child(2){animation-delay:.15s; background:var(--pink);}
  .load-dots span:nth-child(3){animation-delay:.3s; background:var(--yellow);}
  @keyframes loadDotBounce{0%,80%,100%{transform:translateY(0); opacity:.35;} 40%{transform:translateY(-6px); opacity:1;}}

  /* ---------- Toast ---------- */
  #toastHost{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 18px); z-index:400; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
  .toast{
    max-width:88%; background:var(--ink); color:#fff; padding:12px 18px; border-radius:99px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:8px;
    opacity:0; transform:translateY(10px); transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{background:var(--danger);}
  .toast svg{width:15px; height:15px; flex-shrink:0;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  @media (hover:hover){
    .voter-card:hover{background:rgba(255,255,255,0.4);}
    .chip:not(.active):hover{border-color:var(--accent);}
    .btn-primary:hover{filter:brightness(1.05);}
    .icon-btn:hover{background:rgba(255,255,255,0.16);}
    .suggest-check:hover{filter:brightness(1.08);}
  }

  @media (min-width:481px){
    body{background:var(--paper);}
    .app{box-shadow:0 0 90px rgba(0,0,0,0.12);}
  }
</style>
</head>
<body>

<!-- ================= LOGIN SCREEN ================= -->
<div id="loginScreen">
